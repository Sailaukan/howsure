<text x="622" y="238" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">keeps errors ≤ 5%</text>
<text x="932" y="56" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="0.8">PROXY</text>
