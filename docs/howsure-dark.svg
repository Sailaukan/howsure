<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 516" width="1100" height="516" role="img" aria-label="howsure: set up once by asking a System One model about labeled examples (howsure run) and fitting a calibration and cutoff (howsure fit); then on every request the gateway sits between your app and your models and marks each answer auto or review">
<text x="16" y="22" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="1">SET UP ONCE</text>
<rect x="16" y="34" width="290" height="204" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="34" y="64" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="0.8">LABELED EXAMPLES</text>
<rect x="30" y="80" width="262" height="30" rx="7" fill="#21262d"/>
<text x="40" y="100.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Charged twice</text>
<text x="282" y="100.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end">billing</text>
<rect x="30" y="118" width="262" height="30" rx="7" fill="#21262d"/>
<text x="40" y="138.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">App crashes</text>
<text x="282" y="138.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end">technical</text>
<rect x="30" y="156" width="262" height="30" rx="7" fill="#21262d"/>
<text x="40" y="176.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Moved house</text>
<text x="282" y="176.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end">other</text>
<text x="34" y="220" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">input + correct answer</text>
