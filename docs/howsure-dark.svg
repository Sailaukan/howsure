<path d="M370,130 L380,136 L370,142 Z" fill="#768390"/>
<text x="348" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">howsure</text>
<text x="348" y="123" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">run</text>
<rect x="390" y="34" width="290" height="204" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="408" y="64" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="0.8">DECISION MODEL</text>
<text x="408" y="100" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">System One API</text>
<text x="408" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">POST /v1/systemone</text>
<rect x="404" y="156" width="262" height="30" rx="7" fill="#21262d"/>
<text x="414" y="176.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">billing</text>
<text x="656" y="176.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end">p = 0.95</text>
<text x="408" y="220" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">answer + confidence</text>
<line x1="690" y1="136" x2="746" y2="136" stroke="#768390" stroke-width="2"/>
<path d="M744,130 L754,136 L744,142 Z" fill="#768390"/>
<text x="722" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">howsure</text>
<text x="722" y="123" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">fit</text>
<rect x="764" y="34" width="320" height="204" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="782" y="64" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="0.8">CALIBRATE + CUTOFF</text>
<rect x="778" y="80" width="292" height="30" rx="7" fill="#21262d"/>
<text x="788" y="100.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">model says</text>
<text x="1060" y="100.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end">95%</text>
<rect x="778" y="118" width="292" height="30" rx="7" fill="#21262d"/>
<text x="788" y="138.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">actually right</text>
<text x="1060" y="138.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end">75%</text>
<text x="782" y="168" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">→ probabilities corrected</text>
<text x="782" y="196" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start">auto if p ≥ 0.83</text>
<text x="782" y="220" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">keeps errors ≤ 5%</text>
<line x1="812" y1="248" x2="812" y2="280" stroke="#768390" stroke-width="2"/>
<path d="M806,278 L812,288 L818,278 Z" fill="#768390"/>
<text x="800" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">howsure</text>
<text x="800" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="end">gateway</text>
<text x="16" y="288" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="1">EVERY REQUEST</text>
<rect x="16" y="300" width="290" height="200" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="34" y="330" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="0.8">YOUR APP</text>
<rect x="30" y="346" width="262" height="30" rx="7" fill="#21262d"/>
<text x="40" y="366.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">sends</text>
<text x="282" y="366.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end">POST /v1/systemone</text>
<rect x="30" y="384" width="262" height="30" rx="7" fill="#21262d"/>
<text x="40" y="404" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">gets back</text>
<text x="282" y="404" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#9198a1" text-anchor="end">billing <tspan font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" fill="#3987e5">auto</tspan></text>
<text x="34" y="482" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">calls the gateway, not the model</text>
<line x1="316" y1="388" x2="372" y2="388" stroke="#768390" stroke-width="2"/>
<path d="M370,382 L380,388 L370,394 Z" fill="#768390"/>
<line x1="324" y1="412" x2="380" y2="412" stroke="#768390" stroke-width="2"/>
<path d="M326,406 L316,412 L326,418 Z" fill="#768390"/>
<text x="348" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">request</text>
<text x="348" y="434" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">answer</text>
<rect x="390" y="300" width="470" height="200" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="408" y="330" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="0.8">GATEWAY</text>
<text x="408" y="358" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">each answer:</text>
<rect x="404" y="370" width="216" height="36" rx="7" fill="#3987e5" fill-opacity="0.14" stroke="#3987e5" stroke-width="1.5"/>
<text x="416" y="393" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">auto</text>
<text x="608" y="393" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end">p ≥ 0.83</text>
<rect x="404" y="414" width="216" height="36" rx="7" fill="#21262d"/>
<text x="416" y="437" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">review</text>
<text x="608" y="437" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end">p &lt; 0.83</text>
<text x="648" y="358" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">also review when:</text>
<text x="648" y="389" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">the answer is broken</text>
<text x="648" y="411" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">the question changed</text>
<text x="648" y="433" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">the model changed</text>
<text x="648" y="455" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">answers drifted</text>
<text x="408" y="482" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">one endpoint for all your models</text>
