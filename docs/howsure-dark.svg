<text x="944" y="366.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">model 1</text>
<text x="1060" y="366.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end"></text>
<rect x="934" y="384" width="136" height="30" rx="7" fill="#21262d"/>
<text x="944" y="404.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">model 2</text>
<text x="1060" y="404.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end"></text>
<text x="938" y="438" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">next one if a model</text>
<text x="938" y="456" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">fails or isn't sure</text>
<text x="938" y="482" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">any System One API</text>
